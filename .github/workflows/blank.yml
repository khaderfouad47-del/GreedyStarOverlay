
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android project files
        run: |
          echo "Checking project files..."
          ls -la
          test -f gradlew || (echo "ERROR: gradlew not found in repository root" && exit 1)
          test -f settings.gradle -o -f settings.gradle.kts || (echo "ERROR: Gradle settings file not found" && exit 1)
          test -d app || (echo "ERROR: app folder not found" && exit 1)

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GreedyStarOverlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
