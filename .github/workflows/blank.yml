
name
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -q GreedyStarOverlay_Android_Project_READY.zip -d extracted
          echo "Files found in ZIP:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate and build Android project
        run: |
          WRAPPER=$(find extracted -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew is missing inside the ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

          APK=$(find . -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GreedyStarOverlay-APK
          path: app-debug.apk
          if-no-files-found: error
          
